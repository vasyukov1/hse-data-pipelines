apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: report-template
spec:
  entrypoint: generate-report
  templates:
    - name: generate-report
      inputs:
        parameters:
          - name: project-name
            description: Логическое имя проверяемого проекта.
          - name: student-name
            description: Имя автора работы.
          - name: check-status
            description: Итог базовой структурной проверки.
          - name: missing-paths
            description: Список отсутствующих путей.
        artifacts:
          - name: check-report
            path: /work/check-report.txt
      container:
        image: python:3.12-slim
        command: [sh, -c]
        args:
          - |
            set -eu

            python - <<'PY'
            from datetime import datetime, timezone
            from pathlib import Path

            check_status = "{{inputs.parameters.check-status}}"
            summary = (
                "Проект прошёл базовую структурную проверку."
                if check_status == "OK"
                else "Проект требует исправлений перед следующей проверкой."
            )

            check_report = Path("/work/check-report.txt").read_text(encoding="utf-8")
            final_report = Path("/work/final-report.md")
            final_report.write_text(
                "\n".join(
                    [
                        "# CourseWork Data Quality Report",
                        "",
                        f"- Project name: {{inputs.parameters.project-name}}",
                        f"- Student name: {{inputs.parameters.student-name}}",
                        f"- Check status: {check_status}",
                        f"- Missing paths: {{inputs.parameters.missing-paths}}",
                        f"- Generated at: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}",
                        "",
                        summary,
                        "",
                        "## Detailed check report",
                        "",
                        check_report,
                    ]
                ),
                encoding="utf-8",
            )

            print(final_report.read_text(encoding="utf-8"))
            PY
      outputs:
        artifacts:
          # Финальный отчёт удобно скачивать как markdown-артефакт.
          - name: final-report
            path: /work/final-report.md
